[project]
name = "dsp-geometry-engine"
version = "0.1.0"
description = "Independent MCP servers for engine DSP analysis and local Blender/MPFB body-mesh generation"
readme = "README.md"
# PEP 639 SPDX expression: the tree is Apache-2.0 except src/bodymesh_server/blender_scripts/**,
# which is GPL-3.0-or-later (Blender-side workers using MPFB's GPL API). See LICENSES/README.md.
license = "Apache-2.0 AND GPL-3.0-or-later"
# NOTICE is included because Apache-2.0 section 4(d) requires redistributions to carry
# the attribution notices; a wheel that omits it is a distribution without them.
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
authors = [
    { name = "hgner", email = "hgner09@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.2",
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "pillow>=10.3",
    "sympy>=1.14.0",
    "scikit-learn>=1.9.0",
    "joblib>=1.4",
    "pywavelets>=1.9.0",
]

[project.scripts]
dsp-server = "dsp_server.server:main"
dsp-tool = "dsp_server.tool_cli:main"
bodymesh-server = "bodymesh_server.server:main"
bodymesh-tool = "bodymesh_server.tool_cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsp_server", "src/cxx_bridge", "src/bodymesh_server"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # joblib pickles sklearn models with an array-shape assignment NumPy 2.5 deprecated.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
    # An FIR built through TransferFunction trips scipy's leading-coeff check; group_delay
    # uses the raw coefficients, so this is benign here.
    "ignore:Badly conditioned filter coefficients:UserWarning",
]
