[project]
name = "dsp-geometry-engine"
version = "0.1.0"
description = "MCP server: engine vertex dumps -> 1D signals -> FFT/roughness JSON (forearm corrugation RCA)"
readme = "README.md"
authors = [
    { name = "hgner", email = "hgner09@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.2",
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "pillow>=10.3",
    "sympy>=1.14.0",
    "scikit-learn>=1.9.0",
    "joblib>=1.4",
    "pywavelets>=1.9.0",
]

[project.scripts]
dsp-server = "dsp_server.server:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsp_server", "src/cxx_bridge"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # joblib pickles sklearn models with an array-shape assignment NumPy 2.5 deprecated.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
    # An FIR built through TransferFunction trips scipy's leading-coeff check; group_delay
    # uses the raw coefficients, so this is benign here.
    "ignore:Badly conditioned filter coefficients:UserWarning",
]
