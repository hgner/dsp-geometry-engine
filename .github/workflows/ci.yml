# Python-only CI: lint + format + tests across three OSes and two Python versions
# against the stub engine (conftest points DSP_ENGINE_CLI at tests/stub_engine.py).
# C++ verification is deliberately local-only (scripts/verify-engine.ps1). The
# docker job builds the image to keep the Dockerfile honest — no push.
#
# The matrix is what the PyPI `classifiers` in pyproject.toml are allowed to
# claim. Widen the matrix first and let it go green; only then widen the
# classifiers. Never the other way round — a classifier is a promise to users
# filtering on it, and published metadata is immutable per version.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # run the matrix on any branch without opening a PR

# Read-only by default: fork PRs against a public repo run with whatever the
# workflow grants, and nothing here writes to the repo, packages, or releases.
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2  # setup-uv publishes no major-alias tag (no refs/tags/v8)
        with:
          enable-cache: true

      - name: Sync dependencies
        # --python overrides .python-version (pinned to 3.12 for local work) so the
        # same locked resolution is exercised on every interpreter in the matrix.
        run: uv sync --locked --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image (no push)
        run: docker build -t dsp-geometry-engine:ci .
